[workspace]
resolver = "2"
members = ["crates/core", "crates/plugin", "crates/cli"]
# The plugin is built for wasm32-wasip1 only, and its binary shares the CLI's
# name: a plain `cargo build` or `cargo test` is the host's crates.
default-members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = "z"
lto = true
strip = true
