name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check

      # The logic lives in core, so that is where the tests can run natively.
      - run: cargo test -p agenttij-core
      - run: cargo clippy -p agenttij-core --all-targets -- -D warnings

      - run: cargo test -p agenttij-cli
      - run: cargo clippy -p agenttij-cli --all-targets -- -D warnings

      - run: cargo clippy -p agenttij --target wasm32-wasip1 -- -D warnings
      - run: cargo build -p agenttij --target wasm32-wasip1 --release

      - name: script syntax
        run: |
          sh -n hooks/agenttij-state.sh
          sh -n scripts/install.sh
          sh -n scripts/testbox.sh
          sh -n scripts/check-install.sh
          python3 -m py_compile scripts/*.py

  # The plugin in a real Zellij, driven by real keystrokes: the only test
  # crates/plugin has. Each scenario runs in a sealed session, so nothing here
  # depends on the runner's config or cache.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2

      - run: cargo build -p agenttij --target wasm32-wasip1 --release
      # What agents run in a pane; the harness puts it on the panes' PATH.
      - run: cargo build -p agenttij-cli --release

      # The version zellij-tile is pinned to.
      - name: zellij
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/zellij-org/zellij/releases/download/v0.45.1/zellij-x86_64-unknown-linux-musl.tar.gz |
            tar xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The installer edits a Zellij config and Claude's settings: install,
      # check, uninstall, check, in a throwaway home.
      - run: sh scripts/check-install.sh

      - run: python3 scripts/harness.py scenario scripts/e2e/*.txt

      # A failed run keeps its session's directory: the Zellij log, the client's
      # raw output, and the config and layout it was given.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-sessions
          path: /var/tmp/agenttij-harness/
          include-hidden-files: true

  # The same, against a machine watched over ssh: scripts/testbox.sh in a
  # container, whose login shell is zsh. Everything that runs over ssh is
  # covered here and nowhere else.
  e2e-remote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2

      - run: cargo build -p agenttij --target wasm32-wasip1 --release

      - name: zellij
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/zellij-org/zellij/releases/download/v0.45.1/zellij-x86_64-unknown-linux-musl.tar.gz |
            tar xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The plugin's ssh runs as this user, with BatchMode: a key, no passphrase.
      - name: testbox
        run: |
          mkdir -p ~/.ssh && ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/id_ed25519
          host=$(sh scripts/testbox.sh up | sed -n 's/^watching host: //p')
          test -n "$host"
          echo "AGENTTIJ_HOST=$host" >> "$GITHUB_ENV"

      - run: python3 scripts/harness.py scenario scripts/e2e/remote/*.txt

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-remote-sessions
          path: /var/tmp/agenttij-harness/
          include-hidden-files: true
